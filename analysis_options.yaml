# Shared strict analysis. Each package: `include: ../../analysis_options.yaml`
# (examples: `../../../analysis_options.yaml`).
# Base: package:lints/recommended (M0-03 decision, recorded in docs/STATUS.md) plus the
# stricter rules below. very_good_analysis was not adopted to keep dependencies minimal.
include: package:lints/recommended.yaml

# Dart >= 3.7 "tall" formatting decides trailing commas itself, which conflicts with
# `require_trailing_commas`. Preserving existing commas lets both pass
# (maintainer-approved, 28 Oct 2026).
formatter:
  trailing_commas: preserve

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    public_member_api_docs: warning
    avoid_print: error
    unawaited_futures: error
    discarded_futures: error
  exclude:
    - "**/*.g.dart"
    - "**/l10n/generated/**"
    - "**/build/**"
    - "**/.dart_tool/**"
    # Standalone generator package (own resolution, needs Dart 3.11+).
    - "tool/pigeon/**"

linter:
  rules:
    - public_member_api_docs
    - avoid_print
    - avoid_dynamic_calls
    - always_declare_return_types
    - prefer_final_locals
    - prefer_final_fields
    - prefer_const_constructors
    - unawaited_futures
    - discarded_futures
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - avoid_catches_without_on_clauses
    - use_super_parameters
    - directives_ordering
    - sort_pub_dependencies
    - unnecessary_library_name
    - avoid_relative_lib_imports
    - require_trailing_commas
    - no_runtimeType_toString
    - literal_only_boolean_expressions
    - test_types_in_equals
