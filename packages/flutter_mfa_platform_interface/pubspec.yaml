name: flutter_mfa_platform_interface
description: >-
  A common platform interface for the flutter_mfa secure vault (Android Keystore, iOS Keychain, WebCrypto).
version: 0.2.0
homepage: https://breaktroughf1.com/open-source
repository: https://github.com/Breaktroughf1/flutter_mfa
issue_tracker: https://github.com/Breaktroughf1/flutter_mfa/issues
documentation: https://github.com/Breaktroughf1/flutter_mfa#readme
topics:
  - authentication
  - mfa
  - security
  - totp
  - otp
platforms:
  android:
  ios:
  web:

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_mfa_core: ^0.2.0
  meta: ^1.16.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
