name: flutter_mfa_platform_interface
description: >-
  A common platform interface for the flutter_mfa secure vault (Android Keystore, iOS Keychain, WebCrypto).
version: 0.1.0-dev.1
repository: https://github.com/Breaktroughf1/flutter_mfa/tree/main/packages/flutter_mfa_platform_interface
issue_tracker: https://github.com/Breaktroughf1/flutter_mfa/issues
