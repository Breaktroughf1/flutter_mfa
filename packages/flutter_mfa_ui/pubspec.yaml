name: flutter_mfa_ui
description: >-
  Accessible, design-system independent Flutter widgets for multi-factor authentication: OTP code field, code display with countdown, account list, enrolment QR and status badges.
version: 0.1.0-dev.1
repository: https://github.com/Breaktroughf1/flutter_mfa/tree/main/packages/flutter_mfa_ui
issue_tracker: https://github.com/Breaktroughf1/flutter_mfa/issues
topics:
  - mfa
  - totp
  - otp
  - authentication
  - security

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_mfa_core: ^0.1.0-dev.1
  intl: ">=0.20.2 <0.21.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  # Required by `flutter gen-l10n`; the generated code is committed.
  generate: true
