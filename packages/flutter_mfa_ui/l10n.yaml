# Regenerate with `melos run l10n`; the output is committed (published packages
# need it) and `tool/check_l10n.sh` fails CI when it is stale.
arb-dir: lib/l10n
template-arb-file: mfa_en.arb
output-dir: lib/src/l10n/generated
output-localization-file: mfa_localizations.dart
output-class: MfaLocalizations
nullable-getter: true
format: true
# Flutter 3.50's gen-l10n still emits the flutter_localizations Material and
# Cupertino delegates, deprecated since 3.47 in favour of material_ui and
# cupertino_ui. The generated list is kept for apps on the old imports; apps
# should add MfaLocalizations.delegate next to their design system's own
# delegates (see README). Remove this once gen-l10n stops emitting them.
header: "// ignore_for_file: deprecated_member_use"
