name: flutter_mfa
description: >-
  Multi-factor authentication for Flutter: TOTP/HOTP authenticator with hardware-backed secure storage (Keystore, Keychain, WebCrypto), biometric-bound protection and encrypted backup.
version: 0.1.0-dev.1
repository: https://github.com/Breaktroughf1/flutter_mfa/tree/main/packages/flutter_mfa
issue_tracker: https://github.com/Breaktroughf1/flutter_mfa/issues
topics:
  - mfa
  - totp
  - otp
  - authentication
  - security

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_mfa_core: ^0.1.0-dev.1
  flutter_mfa_platform_interface: ^0.1.0-dev.1
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  plugin:
    platforms:
      android:
        package: com.breaktroughf1.flutter_mfa
        pluginClass: FlutterMfaPlugin
      ios:
        pluginClass: FlutterMfaPlugin
      web:
        pluginClass: FlutterMfaWeb
        fileName: src/web/flutter_mfa_web.dart
