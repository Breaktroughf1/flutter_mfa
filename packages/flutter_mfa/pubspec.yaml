name: flutter_mfa
description: >-
  Multi-factor authentication for Flutter: a TOTP/HOTP authenticator with hardware-backed storage (Keystore, Keychain, WebCrypto), biometric protection and encrypted backup.
version: 0.2.0
homepage: https://breaktroughf1.com/open-source
repository: https://github.com/Breaktroughf1/flutter_mfa
issue_tracker: https://github.com/Breaktroughf1/flutter_mfa/issues
documentation: https://github.com/Breaktroughf1/flutter_mfa#readme
topics:
  - authentication
  - mfa
  - security
  - totp
  - otp

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_mfa_core: ^0.2.0
  flutter_mfa_platform_interface: ^0.2.0
  flutter_web_plugins:
    sdk: flutter
  meta: ^1.16.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  plugin:
    platforms:
      android:
        package: com.breaktroughf1.flutter_mfa
        pluginClass: FlutterMfaPlugin
      ios:
        pluginClass: FlutterMfaPlugin
      web:
        pluginClass: FlutterMfaWeb
        fileName: src/web/flutter_mfa_web.dart
