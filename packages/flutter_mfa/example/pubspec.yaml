name: flutter_mfa_example
description: Example app for flutter_mfa.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_mfa:
    path: ../
  flutter_mfa_qr:
    path: ../../flutter_mfa_qr
  flutter_mfa_ui:
    path: ../../flutter_mfa_ui
  material_ui: ^1.4.0

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_mfa_core: ">=0.2.0 <0.4.0"
  flutter_mfa_platform_interface: ">=0.2.0 <0.4.0"
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  uses-material-design: true
