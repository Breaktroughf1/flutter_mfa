name: flutter_mfa_qr
description: >-
  Optional camera QR scanner for otpauth:// enrolment URIs, built for flutter_mfa. No remote decoder is loaded on the web unless you opt in.
version: 0.1.0-dev.1
repository: https://github.com/Breaktroughf1/flutter_mfa/tree/main/packages/flutter_mfa_qr
issue_tracker: https://github.com/Breaktroughf1/flutter_mfa/issues
topics:
  - mfa
  - totp
  - otp
  - authentication
  - security

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_mfa_core: ^0.1.0-dev.1
  flutter_mfa_ui: ^0.1.0-dev.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
