name: flutter_mfa_workspace
publish_to: none
description: Workspace root for the flutter_mfa packages (not published).

environment:
  sdk: ">=3.9.0 <4.0.0"

# Dart pub workspace (Dart >= 3.6). Globs need Dart >= 3.11 and our floor is 3.9,
# so members are listed explicitly.
workspace:
  - packages/flutter_mfa_core
  - packages/flutter_mfa_platform_interface
  - packages/flutter_mfa
  - packages/flutter_mfa/example
  - packages/flutter_mfa_ui
  - packages/flutter_mfa_ui/example
  - packages/flutter_mfa_qr
  - packages/flutter_mfa_qr/example

dev_dependencies:
  lints: ^6.1.0
  melos: ^8.10.0

melos:
  repository: https://github.com/Breaktroughf1/flutter_mfa
  command:
    version:
      workspaceChangelog: false
      linkToCommits: true
      message: "chore(release): publish packages"
  scripts:
    analyze:
      run: dart analyze --fatal-infos .
      description: Static analysis for the whole workspace (NFR-03).
    format:check:
      run: dart format --output=none --set-exit-if-changed .
      description: Fails if any file is not dart-formatted.
    checks:
      run: bash tool/check_no_flutter_in_core.sh && bash tool/check_no_material_in_ui.sh && bash tool/forbidden_apis.sh && bash tool/check_l10n.sh
      description: Architecture and security guard scripts.
    test:core:
      run: cd packages/flutter_mfa_core && if [ -d test ]; then dart test; else echo "no core tests yet"; fi
      description: Fastest loop for core work (pure Dart, VM).
    test:
      run: bash tool/test.sh
      description: All unit, widget and browser tests (goldens run in their own CI job).
    coverage:
      run: bash tool/test.sh --coverage
      description: All tests with line + branch coverage gates (core 95/90, others 85/75).
    test:goldens:
      run: bash tool/goldens.sh
      description: Golden tests; only valid on the pinned Linux CI image.
    goldens:update:
      run: bash tool/goldens.sh --update
      description: Regenerate goldens. Only in a PR labelled as an intended visual change.
    verify:
      run: melos run format:check && melos run analyze && melos run checks && melos run coverage
      description: Run before every commit (format, analyze, guards, all tests + coverage gates).
    l10n:
      run: cd packages/flutter_mfa_ui && flutter gen-l10n
      description: Regenerate flutter_mfa_ui localizations from lib/l10n/*.arb.
    pigeon:
      run: cd tool/pigeon && dart pub get && dart run pigeon --input messages.dart && dart format ../../packages/flutter_mfa_platform_interface/lib/src/messages.g.dart
      description: Regenerate the Pigeon channel code (Dart, Kotlin, Swift) from pigeons/messages.dart.
    publish:dry:
      exec: dart pub publish --dry-run
      packageFilters:
        noPrivate: true
      description: pub.dev dry run for every publishable package.
