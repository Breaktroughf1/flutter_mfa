name: Publish
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
jobs:
  ci:
    uses: Breaktroughf1/.github/.github/workflows/dart-package-ci.yml@main
    with:
      flutter: true
      package-path: packages/flutter_mfa
  publish:
    needs: ci
    permissions:
      id-token: write
      contents: read
    uses: Breaktroughf1/.github/.github/workflows/dart-package-publish.yml@main
    with:
      flutter: true
      package-path: packages/flutter_mfa
