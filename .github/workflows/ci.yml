# CI for flutter_mfa. Starting point — make green and adapt at M0-07.
# M4-04: replace every `@vN` with a full commit SHA (keep the tag in a comment).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 20 * * *" # nightly 02:00 IST: full matrix + long fuzz
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: dart pub global activate melos
      - run: dart pub get
      - run: melos run format:check
      - run: melos run analyze
      - run: melos run checks
      - run: melos run test:core
      - run: melos run test

  min-sdk:
    # Proves the lower bound constraints still hold (NFR-07).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.35.x", channel: stable, cache: true }
      - run: dart pub get
      - run: dart pub downgrade
      - run: dart analyze --fatal-infos .
      - run: cd packages/flutter_mfa_core && dart test

  coverage:
    runs-on: ubuntu-latest
    needs: verify
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: dart pub global activate melos && dart pub global activate coverage
      - run: dart pub get
      - run: melos run coverage # hard gate via tool/coverage_gate.dart (ADR-0008)
      - uses: codecov/codecov-action@v4 # informational only
        if: env.CODECOV_TOKEN != ''
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: packages/*/coverage/lcov.info
          fail_ci_if_error: false

  goldens:
    runs-on: ubuntu-24.04 # pinned image: goldens only valid here
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: dart pub global activate melos && dart pub get
      - run: melos run test:goldens
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: golden-failures, path: packages/flutter_mfa_ui/test/**/failures/ }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: browser-actions/setup-chrome@v1
      - uses: nanasess/setup-chromedriver@v2
      - run: dart pub get
      - name: Web vault tests in Chrome
        run: cd packages/flutter_mfa && flutter test --platform chrome test/web
      - name: WASM build compiles
        run: cd packages/flutter_mfa/example && flutter build web --wasm
      - name: Integration (web)
        run: |
          chromedriver --port=4444 &
          cd packages/flutter_mfa/example
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d web-server --browser-name=chrome --headless

  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 35] # update "latest" at M0-01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: dart pub get
      - name: Native unit tests (JUnit/Robolectric)
        run: cd packages/flutter_mfa/example/android && ./gradlew :flutter_mfa:testDebugUnitTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          script: |
            cd packages/flutter_mfa/example/android && ./gradlew :flutter_mfa:connectedDebugAndroidTest
            cd packages/flutter_mfa/example && flutter test integration_test -d emulator-5554

  ios:
    # Runs on main, nightly, or PRs labelled ci:ios (macOS minutes).
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:ios')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: dart pub get
      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          xcrun simctl boot "$UDID" && echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Native XCTest
        run: cd packages/flutter_mfa/example/ios && pod install && xcodebuild test -workspace Runner.xcworkspace -scheme Runner -destination "id=$SIM_UDID" -only-testing:RunnerTests
      - name: Integration (iOS)
        run: cd packages/flutter_mfa/example && flutter test integration_test -d "$SIM_UDID"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --recursive
            ./
      - run: bash tool/forbidden_apis.sh

  publish-dry-run:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: dart pub global activate melos && dart pub get
      - run: melos run publish:dry
